name: Daten aktualisieren und veröffentlichen

on:
  schedule:
    - cron: "5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_news:
        description: "Nachrichten und Podcast jetzt neu erstellen"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten holen
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FORCE_NEWS: ${{ inputs.force_news }}
        run: python scripts/update.py

      - name: Daten im Repository speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "teconomic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Daten aktualisiert $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            git push
          fi

      - name: Website zusammenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
